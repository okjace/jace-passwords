<!doctype html>
<meta charset="utf-8">
<title>Passkey test site</title>
<style>body{font-family:system-ui;max-width:560px;margin:30px auto;padding:0 16px}button{padding:10px 16px;margin:6px 6px 6px 0;font-size:15px}pre{background:#f2f2f2;padding:12px;white-space:pre-wrap;word-break:break-all;min-height:80px}input{padding:8px;width:100%;box-sizing:border-box}</style>
<h2>Passkey test site (localhost)</h2>
<p>Run <code>tests/passkey_e2e.py</code>, then use the buttons. The site checks every response the way a real one would.</p>
<label>Username <input id="user" value="jace@example.com" autocomplete="username webauthn"></label>
<p><button id="reg">Create a passkey</button><button id="login">Sign in with a passkey</button></p>
<pre id="out">ready</pre>
<script>
// Stand-in for the extension's background script: forwards to the test server's /bg.
window.chrome = { runtime: { onMessage: { addListener() {} }, sendMessage(msg, cb) {
  fetch("/bg", { method: "POST", body: JSON.stringify(msg) }).then((r) => r.json()).then(cb, () => cb({ error: "offline" }));
} } };
const out = (t) => (document.getElementById("out").textContent = t);
const b64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
const post = (p, b) => fetch(p, { method: "POST", body: JSON.stringify(b || {}) }).then((r) => r.json());
document.getElementById("reg").onclick = async () => {
  try {
    const { challenge } = await post("/challenge");
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: b64u(challenge), rp: { id: "localhost", name: "Passkey Test Site" },
      user: { id: new TextEncoder().encode("user-42"), name: document.getElementById("user").value, displayName: "Jace" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { residentKey: "required", userVerification: "preferred" }, extensions: { credProps: true } } });
    const v = await post("/verify-register", cred.toJSON());
    out(`instanceof PublicKeyCredential: ${cred instanceof PublicKeyCredential}\ncredProps: ${JSON.stringify(cred.getClientExtensionResults())}\nalg: ${cred.response.getPublicKeyAlgorithm()}\n\nSite says: ${v.ok ? "✅ " : "❌ "}${v.detail}`);
  } catch (e) { out("❌ " + e.name + ": " + e.message); }
};
document.getElementById("login").onclick = async () => {
  try {
    const { challenge } = await post("/challenge");
    const cred = await navigator.credentials.get({ publicKey: { challenge: b64u(challenge), rpId: "localhost", userVerification: "preferred" } });
    const v = await post("/verify-login", cred.toJSON());
    out(`Signed in as credential ${cred.id.slice(0, 10)}…\n\nSite says: ${v.ok ? "✅ " : "❌ "}${v.detail}`);
  } catch (e) { out("❌ " + e.name + ": " + e.message); }
};
// Load the extension scripts the way the browser would (page world first, then the content script).
(async () => {
  for (const f of ["/extension/passkey-page.js", "/extension/content.js"]) (0, eval)(await fetch(f).then((r) => r.text()));
})();
</script>
