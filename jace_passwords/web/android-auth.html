<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Back to Jace Passwords</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { --bg: #f4f5f7; --panel: #fff; --text: #16181d; --muted: #5d6470; --accent: #1f9d5a; --on: #fff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --panel: #1c1f26; --text: #e6e8eb; --muted: #8b919c; --accent: #3ddc84; --on: #0c1410; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--panel); border-radius: 18px; padding: 28px; max-width: 380px; text-align: center; }
  img { width: 56px; height: 56px; } h1 { font-size: 21px; margin: 14px 0 6px; } p { color: var(--muted); margin: 0 0 18px; }
  a.btn { display: inline-block; background: var(--accent); color: var(--on); padding: 12px 20px; border-radius: 12px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <img src="/icon.svg" alt="">
  <h1 id="h">Back to Jace Passwords</h1>
  <p id="p">You're signed in. Open the app to finish.</p>
  <a class="btn" id="open" href="#">Open Jace Passwords</a>
</div>
<script src="/android-auth.js"></script>
</body>
</html>
