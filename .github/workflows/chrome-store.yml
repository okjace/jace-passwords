# Run by hand (Actions → Chrome Web Store → Run workflow) to upload the current version to the Chrome Web Store
# and submit it for review. Releases do this by themselves (build.yml's chrome-store job).
name: Chrome Web Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upload to the Chrome Web Store
        run: |
          pip install cryptography
          python3 packaging/publish_chrome.py
