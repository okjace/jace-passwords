# The iPhone app, built on GitHub's Macs: `xcodegen` turns this into JacePasswords.xcodeproj (not committed).
# Unsigned: AltStore / SideStore sign it with your own (free) Apple ID when they install it.
name: JacePasswords
options:
  bundleIdPrefix: com.okjace
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.0.0"      # CI passes the real version (jace_passwords/__init__.py)
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: "NO"
targets:
  JacePasswords:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okjace.jacepasswords
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: JacePasswordsSafari
        embed: true
    scheme: {}
  JacePasswordsSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: Safari
      # the browser extension (packaging/build_extension.py safari), copied into the extension as it is
      - path: SafariResources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okjace.jacepasswords.safari
        INFOPLIST_FILE: Safari/Info.plist
